<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskGuard: Autonomous Web Policy & Compliance Guardian</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <h1 class="text-2xl font-bold mb-2 text-cyan-400">TaskGuard DApp</h1>
        <p class="text-sm text-slate-400 mb-6">Autonomous web policy enforcement powered by GenLayer consensus.</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Audit ID</label>
                <input id="audit-id" type="text" value="audit_001" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-cyan-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Target Web URL</label>
                <input id="target-url" type="text" value="https://example.com" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-cyan-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Compliance Rules</label>
                <textarea id="rules" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-cyan-500">Check if the page contains valid terms and secure headers.</textarea>
            </div>
            
            <button onclick="runAudit()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold py-3 rounded-lg transition-all shadow-lg shadow-cyan-900/50 cursor-pointer">
                Run On-Chain Audit
            </button>
        </div>

        <div id="audit-report" class="mt-6 p-4 bg-slate-950 border border-slate-800 rounded-lg text-xs font-mono text-slate-300 min-h-[100px] flex flex-col justify-center">
            Ready for execution. Enter details above and click run.
        </div>
    </div>

    <script type="module">
        import { createClient, createAccount } from "https://esm.sh/genlayer-js";
        import { studionet } from "https://esm.sh/genlayer-js/chains";

        const account = createAccount();

        const client = createClient({
            chain: studionet,
            account: account,
        });

        // ⚠️ REPLACE THIS WITH YOUR ACTUAL DEPLOYED CONTRACT ADDRESS FROM GENSTUDIO
        const CONTRACT_ADDRESS = "0xYourDeployedContractAddressHere";

        window.runAudit = async function() {
            const auditId = document.getElementById("audit-id").value;
            const targetUrl = document.getElementById("target-url").value;
            const rules = document.getElementById("rules").value;
            const reportBox = document.getElementById("audit-report");

            reportBox.innerHTML = "⏳ Submitting transaction to GenLayer validators for consensus...";

            try {
                const txHash = await client.writeContract({
                    address: CONTRACT_ADDRESS,
                    functionName: "run_audit",
                    args: [auditId, targetUrl, rules],
                });

                reportBox.innerHTML = `⏳ Transaction submitted (${txHash.slice(0, 10)}...). Waiting for validator consensus...`;

                // Allow consensus settlement time before fetching state
                await new Promise(resolve => setTimeout(resolve, 4000));

                const status = await client.readContract({
                    address: CONTRACT_ADDRESS,
                    functionName: "get_audit_status",
                    args: [auditId],
                });

                reportBox.innerHTML = `
                    <div style="color: #00ffcc; font-weight: bold; margin-bottom: 6px;">✓ Consensus finalized across GenLayer validator set.</div>
                    <div><strong>Audit ID:</strong> ${auditId}</div>
                    <div><strong>Target:</strong> ${targetUrl}</div>
                    <div><strong>Status:</strong> <span style="color: #34d399;">${status}</span></div>
                    <div style="font-size: 10px; color: #64748b; margin-top: 6px;">Tx: ${txHash}</div>
                `;
            } catch (error) {
                reportBox.innerHTML = `<span style="color: #f87171;">❌ Error: ${error.message}</span>`;
            }
        };
    </script>
</body>
</html>
