<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskGuard: Autonomous Web Policy & Compliance Guardian</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-2xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <h1 class="text-3xl font-bold mb-2 text-cyan-400">TaskGuard DApp</h1>
        <p class="text-sm text-slate-400 mb-6">Autonomous web policy enforcement powered by GenLayer consensus.</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Audit ID</label>
                <input id="audit-id" type="text" value="audit_001" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Target Web URL</label>
                <input id="target-url" type="text" value="https://example.com" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Compliance Rules</label>
                <textarea id="rules" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500">Check if the page contains valid terms and secure headers.</textarea>
            </div>
            
            <!-- Button with ID to control disabled states -->
            <button id="audit-btn" onclick="runAudit()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold py-3.5 rounded-lg transition-all shadow-lg shadow-cyan-900/50 cursor-pointer text-base">
                Run On-Chain Audit
            </button>
        </div>

        <div id="audit-report" class="mt-6 p-5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-mono text-slate-300 min-h-[150px] flex flex-col justify-center overflow-x-auto break-all">
            Ready for execution. Enter details above and click run.
        </div>
    </div>

    <script type="module">
        import { createClient, createAccount } from "https://esm.sh/genlayer-js";
        import { studionet } from "https://esm.sh/genlayer-js/chains";

        const account = createAccount();

        const client = createClient({
            chain: studionet,
            account: account,
        });

        const CONTRACT_ADDRESS = "0x68790eC76Ee3696a06D4515138E4163C143a1239";

        window.runAudit = async function() {
            const auditId = document.getElementById("audit-id").value;
            const targetUrl = document.getElementById("target-url").value;
            const rules = document.getElementById("rules").value;
            const reportBox = document.getElementById("audit-report");
            const btn = document.getElementById("audit-btn");

            // 🔒 Lock button & prevent duplicate submissions during execution
            btn.disabled = true;
            btn.classList.add("opacity-50", "cursor-not-allowed");
            btn.innerText = "⏳ Running Consensus Audit...";

            reportBox.innerHTML = "⏳ Submitting transaction to GenLayer validators for consensus...";

            try {
                const txHash = await client.writeContract({
                    address: CONTRACT_ADDRESS,
                    functionName: "run_audit",
                    args: [auditId, targetUrl, rules],
                });

                reportBox.innerHTML = `⏳ Transaction submitted (${txHash.slice(0, 10)}...). Waiting for validator consensus & finalization...`;

                // Allow consensus settlement time
                await new Promise(resolve => setTimeout(resolve, 5000));

                const status = await client.readContract({
                    address: CONTRACT_ADDRESS,
                    functionName: "get_audit_status",
                    args: [auditId],
                });

                // ✅ Clearly display accepted & finalized state
                reportBox.innerHTML = `
                    <div style="color: #00ffcc; font-weight: bold; margin-bottom: 8px; font-size: 13px;">✓ ACCEPTED & FINALIZED Across GenLayer Validator Set</div>
                    <div style="margin-bottom: 4px;"><strong>Audit ID:</strong> ${auditId}</div>
                    <div style="margin-bottom: 4px;"><strong>Target:</strong> ${targetUrl}</div>
                    <div style="margin-bottom: 6px;"><strong>Compliance Status:</strong> <span style="color: #34d399; font-size: 13px; font-weight: bold;">${status}</span></div>
                    <div style="font-size: 11px; color: #94a3b8; word-break: break-all; margin-top: 6px; border-top: 1px solid #1e293b; padding-top: 6px;"><strong>Tx Hash:</strong> ${txHash}</div>
                `;
            } catch (error) {
                reportBox.innerHTML = `<span style="color: #f87171;">❌ Error: ${error.message}</span>`;
            } finally {
                // 🔓 Unlock button once the audit is fully completed and accepted
                btn.disabled = false;
                btn.classList.remove("opacity-50", "cursor-not-allowed");
                btn.innerText = "Run On-Chain Audit";
            }
        };
    </script>
</body>
</html>
